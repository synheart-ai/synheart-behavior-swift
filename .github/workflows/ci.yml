name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Read-only token: these jobs only check out, build and test.
permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - name: Build (SPM)
        run: swift build

      - name: Run tests
        run: swift test
