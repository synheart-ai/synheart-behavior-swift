name: Bug report
description: Something is broken or behaves unexpectedly in the SDK.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please include enough
        detail for us to reproduce the issue.

        **Privacy:** do not paste user content (text, keystroke content, app
        content, PII) into reproductions. This SDK collects only timing /
        interaction metadata; reports containing user content will be redacted
        or closed.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        Minimal steps or code snippet that reproduces the bug. If possible,
        link to a small repo or gist that demonstrates the issue.
      render: swift
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, stack traces, or unexpected output.
    validations:
      required: true

  - type: input
    id: sdk-version
    attributes:
      label: SynheartBehavior version
      placeholder: "0.3.0"
    validations:
      required: true

  - type: input
    id: toolchain-version
    attributes:
      label: Swift / Xcode versions
      placeholder: "Swift 5.9 / Xcode 15.x"
    validations:
      required: true

  - type: input
    id: ios-version
    attributes:
      label: iOS version / device
      placeholder: "iOS 17.4 / iPhone 15 Pro"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else that might help (logs, screenshots, related issues).
